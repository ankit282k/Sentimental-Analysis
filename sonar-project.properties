# SonarQube project identification
sonar.projectKey=my-python-project
sonar.projectName=My Python Project
sonar.projectVersion=1.0

# Path to source code
sonar.sources=src

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=py

# Exclusions (if needed, e.g., virtual environments, test data)
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/*.pyo,**/*.pyd,venv/**

# Tests (optional, if you add pytest/unittest later)
# sonar.tests=tests
# sonar.test.inclusions=**/test_*.py

# Coverage report (optional, if you run pytest with coverage)
# sonar.python.coverage.reportPaths=coverage.xml
